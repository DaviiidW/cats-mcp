[project]
name = "cats-mcp"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]>=2.0,<3",
]

[project.scripts]
cats-mcp = "cats_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/cats_mcp"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "anyio>=4.15.1",
    "inline-snapshot>=0.35.4",
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.6",
]
